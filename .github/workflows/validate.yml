name: validate-skills

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f LICENSE
      - run: test -f README.md
      - run: test -d skills
      - run: find skills -name SKILL.md | grep .
